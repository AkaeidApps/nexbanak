name: nexbanak
description: "NEXBANK — Next Generation Banking. Native Flutter banking client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & routing
  get: ^4.7.3

  # Networking
  dio: ^5.11.1
  connectivity_plus: ^6.1.5

  # Storage & security
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.6
  local_auth: ^3.0.2

  # UI
  google_fonts: ^6.3.3
  fl_chart: ^0.69.2
  cached_network_image: ^4.0.7

  # Utilities
  intl: ^0.20.3
  image_picker: ^1.2.4
  file_picker: ^8.3.7
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Italic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
